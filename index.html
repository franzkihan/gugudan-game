<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>구구단 별 게임 v1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#1d2939;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:16px}main{margin:0 auto;max-width:470px;background:#fff;border-radius:22px;padding:22px;box-shadow:0 5px 30px #26385a0c}h1{text-align:center;font-size:26px;margin:5px 0 22px}.group{margin:20px 0}label{display:block;font-weight:800;margin-bottom:10px}.choices{display:flex;flex-wrap:wrap;gap:7px}button,select{font:inherit;touch-action:manipulation}button{border:0;cursor:pointer}.chip{background:#edf2f9;color:#24344a;border-radius:11px;padding:12px;min-width:60px;font-weight:800}.chip.active{background:#245dde;color:#fff}select{border:1px solid #b9c5d4;border-radius:12px;background:white;width:100%;padding:12px;font-size:18px}.primary{background:#245dde;color:#fff;width:100%;padding:17px;border-radius:15px;font-size:22px;font-weight:800;margin-top:12px}.secondary{background:#edf2f9;border-radius:12px;padding:13px 16px;font-weight:800}.small{color:#627085;font-size:13px;text-align:center}.hidden{display:none!important}.top{display:flex;justify-content:space-between;font-size:17px;font-weight:800;gap:8px}.problem{font-size:clamp(45px,12vw,66px);font-weight:850;text-align:center;margin:38px 0 12px;white-space:nowrap}.answer{margin:0 auto 12px;border:2px solid #d8e1ef;border-radius:12px;text-align:center;width:180px;height:60px;line-height:56px;font-size:34px;font-weight:800}.status{height:83px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800}.star{color:#f2ac05;font-size:40px;line-height:1}.correct{color:#14804a}.wrong{color:#b45309}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{height:65px;border-radius:12px;background:#edf2f9;font-size:26px;font-weight:800}.key.ok{background:#245dde;color:white}.footer{text-align:center;margin-top:20px}.results{text-align:center;padding:45px 0 25px}.big{font-weight:850;font-size:39px}#health{font-size:12px;color:#64748b;text-align:center;min-height:14px}
</style></head><body><main>
<section id="setup"><h1>⭐ 구구단 별 게임</h1>
<div class="group"><label>연습할 단</label><div class="choices" id="dans"><button type="button" class="chip active" data-dan="2">2단</button><button type="button" class="chip" data-dan="3">3단</button><button type="button" class="chip" data-dan="4">4단</button><button type="button" class="chip" data-dan="5">5단</button><button type="button" class="chip" data-dan="6">6단</button><button type="button" class="chip" data-dan="7">7단</button><button type="button" class="chip" data-dan="8">8단</button><button type="button" class="chip" data-dan="9">9단</button><button type="button" class="chip" data-dan="all">전체</button></div></div>
<div class="group"><label>문제 수</label><div class="choices" id="counts"><button type="button" class="chip active" data-count="10">10문제</button><button type="button" class="chip" data-count="20">20문제</button><button type="button" class="chip" data-count="30">30문제</button><button type="button" class="chip" data-count="0">무제한</button></div></div>
<div class="group"><label for="timer">문제당 제한시간</label><select id="timer"><option value="0">없음</option><option value="10">10초</option><option value="20">20초</option><option value="30">30초</option></select></div>
<button id="start" type="button" class="primary">▶ 시작</button><p class="small">광고·가입·구독·음성 기능 없음</p><div id="health">실행 준비 중…</div></section>
<section id="game" class="hidden"><div class="top"><span id="progress"></span><span id="score"></span><span id="clock"></span></div><div class="problem" id="problem">2 × 3 = ?</div><div class="answer" id="answer">?</div><div class="status" id="status" aria-live="polite"></div><div class="keypad" id="keypad"><button class="key" data-num="1">1</button><button class="key" data-num="2">2</button><button class="key" data-num="3">3</button><button class="key" data-num="4">4</button><button class="key" data-num="5">5</button><button class="key" data-num="6">6</button><button class="key" data-num="7">7</button><button class="key" data-num="8">8</button><button class="key" data-num="9">9</button><button class="key" id="clear">지우기</button><button class="key" data-num="0">0</button><button class="key ok" id="submit">확인</button></div><div class="footer"><button type="button" class="secondary" id="end">■ 끝내기</button></div></section>
<section id="result" class="hidden"><h1>⭐ 연습 끝!</h1><div class="results"><div id="finalScore" class="big"></div><p id="finalDetail"></p></div><button id="again" class="primary">다시 시작</button><button id="back" class="secondary" style="width:100%;margin-top:10px">설정으로</button></section>
</main>
<script>
(function(){
'use strict';
function el(id){return document.getElementById(id)}
var dan='2',count=10,limit=0,index=0,score=0,answered=0,entry='',locked=false,correctAnswer=0,last='',timerId=null,advanceId=null,deadline=0,audio=null;
function show(id){el('setup').className=id==='setup'?'':'hidden';el('game').className=id==='game'?'':'hidden';el('result').className=id==='result'?'':'hidden'}
function bindChoices(attr,container,onChoose){var buttons=el(container).getElementsByTagName('button');for(var i=0;i<buttons.length;i++){(function(b){b.onclick=function(){for(var j=0;j<buttons.length;j++)buttons[j].className='chip';b.className='chip active';onChoose(b.getAttribute(attr))}})(buttons[i])}}
bindChoices('data-dan','dans',function(value){dan=value});bindChoices('data-count','counts',function(value){count=Number(value)});
function stopJobs(){if(timerId!==null){clearInterval(timerId);timerId=null}if(advanceId!==null){clearTimeout(advanceId);advanceId=null}}
function sound(ok){try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();var now=audio.currentTime;var notes=ok?[[650,0,.11],[880,.13,.19]]:[[280,0,.16]];for(var i=0;i<notes.length;i++){var n=notes[i],osc=audio.createOscillator(),gain=audio.createGain();osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(n[0],now+n[1]);gain.gain.setValueAtTime(.0001,now+n[1]);gain.gain.exponentialRampToValueAtTime(.12,now+n[1]+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+n[1]+n[2]);osc.connect(gain);gain.connect(audio.destination);osc.start(now+n[1]);osc.stop(now+n[1]+n[2]+.01)}}catch(e){}}
function refreshAnswer(){el('answer').textContent=entry||'?'}
function top(){el('progress').textContent=count?(index+1)+' / '+count:(index+1)+'번째';el('score').textContent='⭐ '+score}
function random(n){return Math.floor(Math.random()*n)}
function newQuestion(){stopJobs();if(count>0&&index>=count){finish();return}locked=false;entry='';refreshAnswer();el('status').textContent='';el('keypad').style.visibility='visible';var a,b,key,attempt=0;do{a=dan==='all'?random(8)+2:Number(dan);b=random(9)+1;key=a+'-'+b;attempt++}while(key===last&&attempt<20);last=key;correctAnswer=a*b;el('problem').textContent=a+' × '+b+' = ?';top();if(limit>0){deadline=Date.now()+limit*1000;tick();timerId=setInterval(tick,200)}else el('clock').textContent=''}
function tick(){if(locked)return;var ms=deadline-Date.now();el('clock').textContent='⏱ '+Math.max(0,Math.ceil(ms/1000))+'초';if(ms<=0)judge(null)}
function judge(value){if(locked)return;locked=true;stopJobs();answered++;var ok=value!==null&&Number(value)===correctAnswer;var s=el('status');s.textContent='';if(ok){score++;var star=document.createElement('div');star.className='star';star.textContent='⭐';var txt=document.createElement('div');txt.className='correct';txt.textContent='정답!';s.appendChild(star);s.appendChild(txt)}else{var txt2=document.createElement('div');txt2.className='wrong';txt2.textContent=value===null?'시간 끝!':'아쉬워요!';var ans=document.createElement('div');ans.className='wrong';ans.textContent='정답은 '+correctAnswer;s.appendChild(txt2);s.appendChild(ans)}top();el('keypad').style.visibility='hidden';sound(ok);advanceId=setTimeout(function(){index++;newQuestion()},ok?1100:2000)}
function begin(){stopJobs();limit=Number(el('timer').value);index=0;score=0;answered=0;last='';show('game');try{var C=window.AudioContext||window.webkitAudioContext;if(C){if(!audio)audio=new C();if(audio.state==='suspended')audio.resume()}}catch(e){}newQuestion()}
function finish(){stopJobs();locked=true;show('result');el('finalScore').textContent='⭐ '+score+'개 정답';el('finalDetail').textContent='총 '+answered+'문제 중 '+score+'문제 정답 · 정답률 '+(answered?Math.round(score/answered*100):0)+'%'}
el('start').onclick=begin;el('end').onclick=finish;el('again').onclick=begin;el('back').onclick=function(){stopJobs();show('setup')};
var keys=document.querySelectorAll('[data-num]');for(var i=0;i<keys.length;i++){(function(btn){btn.onclick=function(){if(locked||entry.length>=2)return;entry+=btn.getAttribute('data-num');refreshAnswer()}})(keys[i])}
el('clear').onclick=function(){if(!locked){entry=entry.slice(0,-1);refreshAnswer()}};el('submit').onclick=function(){if(!locked&&entry!=='')judge(entry)};
document.addEventListener('keydown',function(e){if(el('game').className==='hidden'||locked)return;if(/^[0-9]$/.test(e.key)&&entry.length<2){entry+=e.key;refreshAnswer()}else if(e.key==='Backspace'){entry=entry.slice(0,-1);refreshAnswer()}else if(e.key==='Enter'&&entry!==''){judge(entry)}});
el('health').textContent='준비 완료 ✓';
})();
</script></body></html>
